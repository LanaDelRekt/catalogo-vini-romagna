<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Vini di Romagna — Schede &amp; Abbinamenti</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--text:#2b2420;--muted:#786e64;--border:#e7ddcf;--romagna:#b6532f;
  color-scheme:light dark;}
/* same dark palette as the catalog, so unlocking is not a light-to-dark flash */
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1815;--card:#252019;--text:#f1ece3;--muted:#a89d8f;--border:#3a332a;--romagna:#d4744b;}
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);padding:24px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;}
.gate{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:36px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 2px 10px rgba(43,36,32,.05);}
.kicker{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted);margin-bottom:12px;}
h1{font-family:Georgia,"Iowan Old Style",Palatino,serif;font-weight:600;font-size:25px;margin:0 0 8px;}
p.sub{color:var(--muted);font-size:13px;margin:0 0 24px;}
form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
input{flex:1 1 200px;padding:10px 16px;border-radius:999px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:14px;}
input:focus{outline:none;border-color:var(--romagna);}
button{padding:10px 22px;border-radius:999px;border:1px solid var(--romagna);background:var(--romagna);
  color:#fff;font-size:14px;cursor:pointer;}
button:disabled{opacity:.6;cursor:default;}
.msg{margin-top:16px;font-size:13px;min-height:20px;color:var(--romagna);}
.msg.working{color:var(--muted);}
</style>
</head>
<body>
<main class="gate">
  <div class="kicker">Catalogo riservato</div>
  <h1>Vini di Romagna</h1>
  <p class="sub">Schede vino, vitigni e abbinamenti gastronomici.<br>Pagina riservata: inserisci la password.</p>
  <form id="f">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Apri</button>
  </form>
  <div class="msg" id="msg"></div>
</main>

var msg = document.getElementById('msg');

function bytes(b64){
  var bin = atob(b64), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function unlock(password){
  var enc = new TextEncoder();
  var material = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:bytes(DATA.salt), iterations:DATA.iterations, hash:'SHA-256'},
    material, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(DATA.iv)}, key, bytes(DATA.ct));
  var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  if (!window.crypto || !crypto.subtle){
    msg.className = 'msg';
    msg.textContent = 'Questa pagina va aperta via https (o localhost): il browser non espone la crittografia su file://.';
    return;
  }
  var btn = document.getElementById('go');
  btn.disabled = true;
  msg.className = 'msg working';
  msg.textContent = 'Sblocco in corso…';
  try {
    var html = await unlock(document.getElementById('pw').value);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    msg.className = 'msg';
    msg.textContent = 'Password errata.';
    btn.disabled = false;
    document.getElementById('pw').select();
  }
});
</script>
